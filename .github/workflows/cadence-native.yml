name: Cadence native iPhone

on:
  pull_request:
    branches: [main]
    paths:
      - "Cadence/Cadence/**"
      - "Cadence/CadenceNativeCore/**"
      - "Cadence/Cadence.xcodeproj/**"
      - "Cadence/Config/**"
      - ".github/workflows/cadence-native.yml"
  push:
    branches: [main]
    paths:
      - "Cadence/Cadence/**"
      - "Cadence/CadenceNativeCore/**"
      - "Cadence/Cadence.xcodeproj/**"
      - "Cadence/Config/**"
      - ".github/workflows/cadence-native.yml"

permissions:
  contents: read

concurrency:
  group: cadence-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native Core · iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Verify native core
        working-directory: Cadence/CadenceNativeCore
        run: swift run CadenceNativeCoreChecks

      - name: Select available iPhone Simulator
        id: simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devices in data.items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone Simulator")
          print(sorted(candidates, reverse=True)[0][2])
          ')"
          printf 'udid=%s\n' "$udid" >> "$GITHUB_OUTPUT"
          if ! xcrun simctl list devices | grep -F "$udid" | grep -q "(Booted)"; then
            xcrun simctl boot "$udid"
          fi
          xcrun simctl bootstatus "$udid" -b

      - name: Build, install and launch Cadence
        env:
          CADENCE_SUPABASE_URL: https://example.supabase.co
          CADENCE_SUPABASE_ANON_KEY: ci-public-placeholder
        run: |
          set -euo pipefail
          derived_data="$RUNNER_TEMP/CadenceDerivedData"
          xcodebuild \
            -project Cadence/Cadence.xcodeproj \
            -scheme Cadence \
            -sdk iphonesimulator \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CADENCE_SUPABASE_URL="$CADENCE_SUPABASE_URL" \
            CADENCE_SUPABASE_ANON_KEY="$CADENCE_SUPABASE_ANON_KEY" \
            build

          app_path="$derived_data/Build/Products/Debug-iphonesimulator/Cadence.app"
          test -d "$app_path"
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "$app_path"
          xcrun simctl launch "${{ steps.simulator.outputs.udid }}" com.cadence.app
          sleep 3
          mkdir -p "$RUNNER_TEMP/cadence-native-evidence"
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot \
            "$RUNNER_TEMP/cadence-native-evidence/login.png"
          xcrun simctl get_app_container \
            "${{ steps.simulator.outputs.udid }}" com.cadence.app app

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadence-native-simulator-evidence
          path: ${{ runner.temp }}/cadence-native-evidence
          if-no-files-found: error
          retention-days: 14
