name: Cadence web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify sanitized public repository
        shell: bash
        run: |
          test -f README.md
          test -f .github/workflows/cadence-web.yml
          test ! -d Cadence
          test ! -d CadenceFinancial
          test ! -d CadenceFitness
          test ! -d articles
          test ! -d docs
