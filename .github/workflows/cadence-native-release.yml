name: Cadence native release

on:
  pull_request:
    branches: [main]
    paths:
      - "Cadence/Cadence/**"
      - "Cadence/CadenceNativeCore/**"
      - "Cadence/Cadence.xcodeproj/**"
      - "Cadence/Config/**"
      - "Cadence/app-store/**"
      - "Cadence/scripts/validate_ios_release.py"
      - ".github/workflows/cadence-native-release.yml"
  push:
    branches: [main]
    paths:
      - "Cadence/Cadence/**"
      - "Cadence/CadenceNativeCore/**"
      - "Cadence/Cadence.xcodeproj/**"
      - "Cadence/Config/**"
      - "Cadence/app-store/**"
      - "Cadence/scripts/validate_ios_release.py"
      - ".github/workflows/cadence-native-release.yml"
  workflow_dispatch:
    inputs:
      release_action:
        description: Validate the signed IPA or upload it to TestFlight
        required: true
        default: validate
        type: choice
        options:
          - validate
          - upload

permissions:
  contents: read

concurrency:
  group: cadence-native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-validation:
    name: Unsigned device archive · Release metadata
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub's live macOS 15 manifest lists Xcode 26.3 at this exact path:
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | python3 -c "import sys; data=sys.stdin.read(); raise SystemExit(0 if 'iphoneos26' in data else 'iOS 26 SDK is unavailable')"

      - name: Validate release assets
        run: python3 Cadence/scripts/validate_ios_release.py

      - name: Build unsigned generic iOS archive
        env:
          CADENCE_SUPABASE_URL: https://example.supabase.co
          CADENCE_SUPABASE_ANON_KEY: ci-public-placeholder
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Cadence-unsigned.xcarchive"
          xcodebuild archive \
            -project Cadence/Cadence.xcodeproj \
            -scheme Cadence \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            CADENCE_SUPABASE_URL="$CADENCE_SUPABASE_URL" \
            CADENCE_SUPABASE_ANON_KEY="$CADENCE_SUPABASE_ANON_KEY" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

          app="$archive/Products/Applications/Cadence.app"
          test -d "$app"
          test -x "$app/Cadence"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'com.cadence.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = '1.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")" = '17.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist")" = 'false'
          test -f "$app/PrivacyInfo.xcprivacy"

          python3 - "$app/Info.plist" "$RUNNER_TEMP/archive-evidence.json" <<'PY'
          import json, plistlib, sys
          with open(sys.argv[1], 'rb') as handle:
              info = plistlib.load(handle)
          evidence = {
              'bundle_id': info['CFBundleIdentifier'],
              'version': info['CFBundleShortVersionString'],
              'build': info['CFBundleVersion'],
              'minimum_os': info['MinimumOSVersion'],
              'non_exempt_encryption': info['ITSAppUsesNonExemptEncryption'],
              'signed': False,
          }
          with open(sys.argv[2], 'w', encoding='utf-8') as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
          print(json.dumps(evidence, sort_keys=True))
          PY

      - name: Upload archive evidence
        uses: actions/upload-artifact@v7
        with:
          name: cadence-native-archive-evidence
          path: ${{ runner.temp }}/archive-evidence.json
          if-no-files-found: error
          retention-days: 30

  testflight:
    name: Signed App Store archive · TestFlight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: archive-validation
    runs-on: macos-15
    timeout-minutes: 45
    environment: app-store
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      CADENCE_SUPABASE_URL: ${{ vars.CADENCE_SUPABASE_URL }}
      CADENCE_SUPABASE_ANON_KEY: ${{ secrets.CADENCE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub's live macOS 15 manifest lists Xcode 26.3 at this exact path:
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | python3 -c "import sys; data=sys.stdin.read(); raise SystemExit(0 if 'iphoneos26' in data else 'iOS 26 SDK is unavailable')"

      - name: Require release credentials
        run: |
          set -euo pipefail
          for name in \
            APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APPLE_PROVISIONING_PROFILE_BASE64 CADENCE_SUPABASE_URL CADENCE_SUPABASE_ANON_KEY; do
            test -n "${!name:-}" || { echo "Missing required app-store environment value: $name" >&2; exit 1; }
          done

      - name: Install ephemeral signing material
        id: signing
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"
          keychain="$RUNNER_TEMP/cadence-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'], 'distribution.p12').write_bytes(
              base64.b64decode(os.environ['APPLE_DISTRIBUTION_CERTIFICATE_BASE64'], validate=True)
          )
          pathlib.Path(os.environ['RUNNER_TEMP'], 'profile.mobileprovision').write_bytes(
              base64.b64decode(os.environ['APPLE_PROVISIONING_PROFILE_BASE64'], validate=True)
          )
          key_dir = pathlib.Path.home() / '.appstoreconnect' / 'private_keys'
          key_dir.mkdir(parents=True, exist_ok=True)
          key_path = key_dir / f"AuthKey_{os.environ['ASC_KEY_ID']}.p8"
          key_path.write_bytes(base64.b64decode(os.environ['ASC_PRIVATE_KEY_BASE64'], validate=True))
          key_path.chmod(0o600)
          PY

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          test "$profile_team" = "$APPLE_TEAM_ID"
          test "$profile_app_id" = "$APPLE_TEAM_ID.com.cadence.app"

          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_path="$profile_directory/$profile_uuid.mobileprovision"
          mkdir -p "$profile_directory"
          cp "$profile" "$profile_path"
          printf 'profile_name=%s\n' "$profile_name" >> "$GITHUB_OUTPUT"
          printf 'profile_path=%s\n' "$profile_path" >> "$GITHUB_OUTPUT"
          printf 'keychain=%s\n' "$keychain" >> "$GITHUB_OUTPUT"

      - name: Archive and export App Store IPA
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Cadence.xcarchive"
          export_path="$RUNNER_TEMP/export"
          export_options="$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild archive \
            -project Cadence/Cadence.xcodeproj \
            -scheme Cadence \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            CADENCE_SUPABASE_URL="$CADENCE_SUPABASE_URL" \
            CADENCE_SUPABASE_ANON_KEY="$CADENCE_SUPABASE_ANON_KEY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

          python3 - "$export_options" <<'PY'
          import os, plistlib, sys
          options = {
              'method': 'app-store-connect',
              'destination': 'export',
              'signingStyle': 'manual',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'provisioningProfiles': {'com.cadence.app': os.environ['PROFILE_NAME']},
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
              'manageAppVersionAndBuildNumber': False,
          }
          with open(sys.argv[1], 'wb') as handle:
              plistlib.dump(options, handle)
          PY

          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          ipa="$(python3 - "$export_path" <<'PY'
          from pathlib import Path
          import sys
          matches = list(Path(sys.argv[1]).glob('*.ipa'))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one IPA, found {len(matches)}')
          print(matches[0])
          PY
          )"
          printf 'IPA_PATH=%s\n' "$ipa" >> "$GITHUB_ENV"

      - name: Validate IPA with App Store Connect
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA to TestFlight
        if: github.event.inputs.release_action == 'upload'
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove ephemeral signing material
        if: always()
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain }}" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          rm -f "${{ steps.signing.outputs.profile_path }}"
